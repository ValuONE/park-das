en:
  commands:
    start: Starts or restarts the bot.
    help: Lists all available commands.
    settings: View and edit available settings.
    overview: View all parking spots and their occupancy level.
    automatic: Enables automatic parking recommendations on arrival.
    recommend: Location-based recommendation of nearby free parking spots with navigation.
    navigation: View free parking spots on a map and navigate to them.
    timer: Sends a parking recommendation at a specified point of time.
  error:
    all_full: Unfortunately, there currently are no free parking spots!
    command_unknown: |
      Input was not recognized as a command 🚫.
      Please enter a different prompt 📝.
    mapprovider_not_set: |
      ⚠️

      Please select a map provider using
      /settings first!
  help:
    msg: "The following commands are available:"
  welcome:
    msg: 🤖 Welcome to ParkBot 🚘
  location:
    btn: 📍 Send location
    msg: Tap on „%{.btn}“ to send your current location.
  recommended:
    msg: |
      The recommended parking spot is:

      %{spot}
    nav_msg: Start navigation
  overview:
    campus: |
      🎓 University parking spots:

      %{msg}
    city: |
      🏙️ City parking spots:

      %{msg}
    single: "%{name}: %{free} free | %{occupancy}"
    multiple: "%{index}) %{.single}"
  timer:
    unknown: 📅 When should the recommendation be sent? ⏰
    cancel: Recommendation was cancelled 🗑️!
    set: "Recommendation will be sent on the 📅 %{date} at ⏰ %{time}!"
    loc_set: "Recommendation for 📍 %{loc} will be sent on the 📅 %{date} at ⏰ %{time}!"
    set_cancel: Recommendation was not set!
    set_already: |
      ℹ️ Recommendation is already set for ⏰ %{time} on the 📅 %{date}!
      🔄 What should the recommendation be changed to?
    loc_set_already: |
      ℹ️ Recommendation for 📍 %{loc} is already set for ⏰ %{time} on the 📅 %{date}!
      🔄 What should the recommendation be changed to?
    set_already_cancel: Recommendation was not changed!
  automatic:
    tutorial: Please enable live location sharing to recieve automatic recommendations!
    set: Automatic recommendations activated ⛳️!
    cancel: Automatic recommendations deactivated 🗑️!
    triggered: Welcome on campus 🎓!
  navigation:
    msg: "Navigation links to recommended parking spots:"
    btn: "%{index}: %{level} %{free}"
  voice:
    processing: ⏳ Message is being processed ⌛️
    not_understood: No text could be recognized 😕. Please try again 🔄.
    echo_msg: "Recognized text 🎤:"
  settings:
    back: ◀️ Back
    undefined: Not set ❌
    options:
