en:
  commands:
    start: 🔄 Starts or resets the bot.
    help: ❓ Lists all commands.
    settings: ⚙️ Display and adjust settings.
    overview: 📊 Displays parking lots and their occupancy.
    automatic: 🤖 Set up automatic parking recommendations.
    recommend: 📍 Parking recommendations with navigation.
    navigation: 🗺️ Navigation to available parking lots.
    timer: ⏰ Set up a recommendation for a specific time.
  error:
    callback: ❌ Unknown callback!
    all_full: 😕 Unfortunately, there currently are no free parking spots!
    command_unknown: |
      🚫 Input was not recognized as a command.
      📝 Please enter a different prompt.
    mapprovider_not_set: |
      ⚠️

      Please select a map provider using
      /settings first!
  help:
    msg: "📋 The following commands are available:"
  welcome:
    msg: 🤖 Welcome to ParkBot 🚗
  location:
    btn: 📍 Send location
    msg: "🧭 For a location-based recommendation,
      please tap on „%{.btn}“ to send your current location."
  recommended:
    msg: |
      🅿️ The recommended parking spot is:

      %{spot}
    nav_msg: 🚗 Start navigation
  overview:
    campus: |
      🎓 University parking spots:

      %{msg}
    city: |
      🏙️ City parking spots:

      %{msg}
    single: "%{name}: %{free} free | %{occupancy}"
    multiple: "%{index}) %{.single}"
  timer:
    unknown: 📅 When should the recommendation be sent? ⏰
    cancel: 🗑️ Recommendation was cancelled!
    set: "Recommendation will be sent on the 📅 %{date} at ⏰ %{time}!"
    loc_set: "Recommendation for 📍 %{loc} will be sent on the 📅 %{date} at ⏰ %{time}!"
    set_cancel: ❌ Recommendation was not set!
  automatic:
    tutorial: 📍 Please share live location to receive automatic recommendations!
    set: ✅ Automatic recommendations activated!
    cancel: 🗑️ Automatic recommendations deactivated!
    triggered: 🎓 Welcome to the campus!
  navigation:
    msg: "🗺️ Navigation links to recommended parking spots:"
    btn: "%{index}: %{level} %{free}"
  voice:
    processing: ⏳ Message is being processed ⌛️
    not_understood: 😕 No text could be recognized. Please try again 🔄.
    echo_msg: "🎤 Recognized text:"
  settings:
    back: ◀️ Back
    undefined: Not set ❌
    options:
