stages:
  - lint
  - build

pylint:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install pylint poetry
    - poetry run pylint **/*.py
  allow_failure: false

docker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile $CI_PROJECT_DIR/Dockerfile
        --destination $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "deploy" && $CI_PIPELINE_SOURCE == "push" # Only run when merging to deploy branch